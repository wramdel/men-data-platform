# Configuración pytest: raíz del repo = men-data-platform/
# El código de la app vive en frontend/streamlit_app (imports tipo services.*, components.*).

[pytest]
testpaths = tests
pythonpath = frontend/streamlit_app
filterwarnings =
    ignore::DeprecationWarning
addopts =
    -ra
    --strict-markers

markers =
    unit: pruebas unitarias aisladas (sin Excel ni red)
    integration: ensamblan varios módulos o datos de fixture más realistas
